<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ريموت التنين الفوكسيل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: #fff; touch-action: none; font-family: system-ui, sans-serif; }
    </style>
</head>
<body class="flex flex-col items-center justify-between h-screen p-4 select-none overflow-hidden">

    <!-- الهيدر -->
    <div class="text-center mt-2">
        <h1 class="text-amber-400 font-bold text-xl">🐉 ريموت تحكم التنين</h1>
        <p id="status" class="text-xs text-slate-400 mt-1">متصل بالسحاب وجاهز للإرسال</p>
    </div>

    <!-- لوحة التحكم الحركية (Gait) -->
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl">
        <p class="text-xs text-slate-400 mb-2 font-bold">طريقة الحركة:</p>
        <div class="grid grid-cols-2 gap-2 mb-3">
            <button onclick="sendCommand('gait', 'Walk')" class="bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold text-sm shadow">🚶‍♂️ مشي (Walk)</button>
            <button onclick="sendCommand('gait', 'Run')" class="bg-amber-600 hover:bg-amber-500 py-3 rounded-xl font-bold text-sm shadow">🏃‍♂️ جري (Run)</button>
        </div>
        <button onclick="sendCommand('gait', 'Idle')" class="w-full bg-slate-800 hover:bg-slate-700 py-3 rounded-xl font-bold text-sm text-slate-300 shadow">⏹️ وقوف تام (Idle)</button>
    </div>

    <!-- أزرار الأكشن السريعة -->
    <div class="w-full max-w-md grid grid-cols-2 gap-3">
        <button onclick="sendActionOnly('roar')" class="bg-red-600 hover:bg-red-500 py-4 rounded-2xl font-bold text-sm shadow">🔥 زئير ونار</button>
        <button onclick="sendActionOnly('come')" class="bg-emerald-600 hover:bg-emerald-500 py-4 rounded-2xl font-bold text-sm shadow">🦅 تعال عندي</button>
    </div>

    <script>
        // حط هنا رابط الـ JSONBin والمفتاح الخاص بك
        const BIN_URL = "https://api.jsonbin.io/v3/b/حط_رقم_الـ_Bin_هنا";
        const MASTER_KEY = "حط_المفتاح_هنا_X-Master-Key";

        async function sendCommand(type, val) {
            let payload = { action: type, value: val };
            await pushToCloud(payload);
        }

        async function sendActionOnly(act) {
            let payload = { action: act };
            await pushToCloud(payload);
        }

        async function pushToCloud(payload) {
            document.getElementById('status').innerText = "جاري إرسال الأمر...";
            try {
                let res = await fetch(BIN_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(payload)
                });
                if(res.ok) {
                    document.getElementById('status').innerText = "تم التنفيذ وإرسال الأمر بنجاح! ✅";
                } else {
                    document.getElementById('status').innerText = "⚠️ خطأ في الاستجابة من السحاب";
                }
            } catch(e) {
                document.getElementById('status').innerText = "⚠️ فشل الاتصال بالإنترنت";
            }
        }
    </script>
</body>
</html>
